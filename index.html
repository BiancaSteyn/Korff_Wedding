<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tristan & Ankia | Wedding</title>

<style>
    :root {
        --blue: #99BED4;
        --burgundy: #824C53;
        --pink: #FFDFE1;
        --cream: #EDE1DE;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        min-height: 100%;
    }

    body {
        background: var(--blue);
        color: var(--burgundy);
        font-family: Georgia, "Times New Roman", serif;
        overflow-x: hidden;
    }

    .page {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        isolation: isolate;
        padding: clamp(34px, 6vw, 80px) 18px 34px;
    }

    /* Decorative flowers are actual image elements, not the page itself. */
    .floral {
        position: absolute;
        z-index: -1;
        pointer-events: none;
        user-select: none;
        width: clamp(190px, 30vw, 390px);
        height: auto;
    }

    .top-left {
        top: -12px;
        left: -20px;
    }

    .top-right {
        top: -12px;
        right: -20px;
    }

    .bottom-left {
        bottom: -20px;
        left: -20px;
    }

    .bottom-right {
        bottom: -20px;
        right: -20px;
    }

    .content {
        width: min(100%, 760px);
        margin: 0 auto;
        text-align: center;
        position: relative;
        z-index: 2;
    }

    .eyebrow {
        font-size: clamp(11px, 2vw, 16px);
        letter-spacing: .28em;
        text-transform: uppercase;
        margin-bottom: 14px;
    }

    h1 {
        font-size: clamp(45px, 8.5vw, 94px);
        line-height: .98;
        font-weight: 400;
        letter-spacing: -.025em;
        margin-bottom: 18px;
    }

    .date {
        font-size: clamp(15px, 2.5vw, 22px);
        letter-spacing: .34em;
        text-transform: uppercase;
        margin-bottom: 25px;
    }

    .divider {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin: 0 auto 28px;
        max-width: 540px;
    }

    .divider::before,
    .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--burgundy);
        opacity: .8;
    }

    .divider-flower {
        width: 62px;
        height: 44px;
        object-fit: contain;
    }

    .camera-art {
    display: block;
    width: min(340px, 55vw);
    height: 125px;
    object-fit: cover;
    object-position: center;
    margin: 0 auto -14px;
    mix-blend-mode: multiply;
    opacity: .98;
}

    .title-script {
        font-size: clamp(72px, 13vw, 142px);
        line-height: .9;
        font-style: italic;
        font-weight: 400;
        margin-bottom: 14px;
    }

    .subtitle {
        font-size: clamp(13px, 2.5vw, 23px);
        letter-spacing: .20em;
        text-transform: uppercase;
        margin-bottom: 24px;
    }

    .message {
        max-width: 620px;
        margin: 0 auto 30px;
        font-size: clamp(17px, 3vw, 27px);
        line-height: 1.42;
        font-style: italic;
    }

    .upload-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        width: min(100%, 590px);
        min-height: 68px;
        margin: 0 auto;
        padding: 16px 26px;
        border-radius: 14px;
        background: var(--burgundy);
        color: white;
        text-decoration: none;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(15px, 2.4vw, 22px);
        letter-spacing: .16em;
        text-transform: uppercase;
        box-shadow: 0 7px 18px rgba(72, 32, 38, .18);
        transition: transform .15s ease, box-shadow .15s ease;
    }

    .upload-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(72, 32, 38, .24);
    }

    .camera-icon {
        width: 31px;
        height: 24px;
        border: 2px solid white;
        border-radius: 5px;
        position: relative;
        flex: 0 0 auto;
    }

    .camera-icon::before {
        content: "";
        position: absolute;
        width: 11px;
        height: 6px;
        border: 2px solid white;
        border-bottom: 0;
        border-radius: 3px 3px 0 0;
        top: -8px;
        left: 7px;
    }

    .camera-icon::after {
        content: "";
        position: absolute;
        width: 9px;
        height: 9px;
        border: 2px solid white;
        border-radius: 50%;
        left: 8px;
        top: 5px;
    }

    .footer-line {
        margin-top: 24px;
        font-size: clamp(12px, 2vw, 17px);
        letter-spacing: .20em;
        text-transform: uppercase;
    }

    @media (max-width: 600px) {
        .page {
            padding: 34px 16px 28px;
        }

        .floral {
            width: 185px;
        }

        .top-left,
        .top-right {
            top: -5px;
        }

        .bottom-left,
        .bottom-right {
            bottom: -8px;
        }

        .camera-art {
    width: 62vw;
    height: 95px;
    margin-bottom: -4px;
}

        .message {
            max-width: 340px;
            margin-bottom: 24px;
        }

        .upload-button {
            min-height: 60px;
            padding: 13px 14px;
            gap: 12px;
            letter-spacing: .11em;
        }
    }

    @media (max-height: 720px) and (max-width: 600px) {
        .page {
            padding-top: 24px;
        }

        .eyebrow {
            margin-bottom: 7px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .date {
            margin-bottom: 14px;
        }

        .divider {
            margin-bottom: 12px;
        }

        .camera-art {
            height: 90px;
        }

        .title-script {
            font-size: 66px;
        }

        .subtitle {
            margin-bottom: 12px;
        }

        .message {
            font-size: 15px;
            margin-bottom: 15px;
        }

        .footer-line {
            margin-top: 12px;
        }
    }
</style>
</head>

<body>
<main class="page">

    <img class="floral top-left" src="wedding_assets/flowers-top-left.png" alt="">
    <img class="floral top-right" src="wedding_assets/flowers-top-right.png" alt="">
    <img class="floral bottom-left" src="wedding_assets/flowers-bottom-left.png" alt="">
    <img class="floral bottom-right" src="wedding_assets/flowers-bottom-right.png" alt="">

    <section class="content">

        <div class="eyebrow">Welcome to our wedding</div>

        <h1>Tristan &amp; Ankia</h1>

        <div class="date">27 September 2026</div>

        <div class="divider">
            <img class="divider-flower" src="wedding_assets/flowers-camera.png" alt="">
        </div>

        <img
            class="camera-art"
            src="wedding_assets/flowers-camera.png"
            alt=""
        >

        <div class="title-script">I Spy...</div>

        <div class="subtitle">The Wedding Photo Challenge</div>

        <p class="message">
            Capture the special moments,<br>
            complete your table’s challenges<br>
            and help create memories<br>
            Tristan &amp; Ankia will treasure forever.
        </p>

        <a class="upload-button" href="upload.html">
            <span class="camera-icon" aria-hidden="true"></span>
            <span>Upload Your Photos</span>
        </a>

        <div class="footer-line">Snap &nbsp;•&nbsp; Scan &nbsp;•&nbsp; Share &nbsp;•&nbsp; Win 🏆</div>

    </section>
</main>
</body>
</html>
