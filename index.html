<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tristan & Ankia | Wedding</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #99BED4;
            font-family: Georgia, "Times New Roman", serif;
            overflow-x: hidden;
        }

        .page {
            position: relative;
            width: 100%;
            min-height: 100svh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
            background: #99BED4;
        }

        /*
         * The generated wedding artwork is the actual background artwork.
         * Keep tristan-ankia-home-artwork.png in the same GitHub folder
         * as this index.html file.
         */
        .artwork {
            display: block;
            width: 100%;
            height: auto;
            min-height: 100svh;
            object-fit: cover;
            object-position: center top;
        }

        /*
         * Transparent clickable area placed over the artwork.
         * It deliberately has no visible styling so the artwork remains
         * completely unchanged.
         */
        .upload-link {
            position: absolute;
            left: 50%;
            bottom: 10.5%;
            transform: translateX(-50%);

            width: min(72%, 360px);
            height: 68px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            color: transparent;
            text-decoration: none;

            background: transparent;
            -webkit-tap-highlight-color: transparent;
        }

        .upload-link:focus-visible {
            outline: 3px solid #824C53;
            outline-offset: 4px;
        }

        /*
         * The artwork was designed vertically. On smaller phones we
         * preserve the artwork rather than cropping its important details.
         */
        @media (max-width: 600px) {
            .artwork {
                width: 100%;
                min-height: auto;
                object-fit: contain;
            }

            .page {
                min-height: auto;
            }

            .upload-link {
                bottom: 9.5%;
                width: 78%;
                height: 62px;
            }
        }

        @media (min-width: 601px) {
            .page {
                min-height: 100vh;
            }

            .artwork {
                width: min(100%, 900px);
                min-height: 100vh;
                object-fit: contain;
            }

            .upload-link {
                bottom: 8%;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <img
            class="artwork"
            src="tristan-ankia-home-artwork.png"
            alt="Tristan and Ankia wedding photo challenge"
        >

        <a
            class="upload-link"
            href="upload.html"
            aria-label="Upload wedding photos"
            title="Upload your photos"
        >
            Upload your photos
        </a>

    </main>

</body>
</html>
