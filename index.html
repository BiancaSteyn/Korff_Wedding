<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tristan & Ankia | Wedding</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        min-height: 100%;
        background: #99BED4;
    }

    body {
        overflow-x: hidden;
    }

    .page {
        position: relative;
        width: 100vw;
        height: 100svh;
        min-height: 100svh;
        overflow: hidden;
        background: #99BED4;
    }

    /*
       Wide version:
       The generated artwork remains completely intact in the middle.
       The surrounding area is filled by a soft extension of the same artwork,
       so there are no hard blue side gaps.
    */
    .wide-background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: 0;
    }

    /*
       Keep the original artwork itself undistorted.
       It is fitted to the available height.
    */
    .main-artwork {
        position: absolute;
        top: 50%;
        left: 50%;
        height: 100%;
        width: auto;
        max-width: none;
        transform: translate(-50%, -50%);
        z-index: 1;
        display: block;
    }

    /*
       The real clickable link sits over the illustrated
       "UPLOAD YOUR PHOTOS" button.
    */
    .upload-link {
        position: absolute;
        z-index: 3;

        left: 50%;
        top: 75.7%;
        transform: translateX(-50%);

        width: min(38.5vh, 63%);
        height: 7%;

        display: block;
        border-radius: 14px;

        background: transparent;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }

    .upload-link:focus-visible {
        outline: 3px solid #824C53;
        outline-offset: 4px;
    }

    /*
       On very tall/narrow phones, use the artwork's natural proportions.
       This keeps all the important wedding content visible.
    */
    @media (max-aspect-ratio: 2 / 3) {
        .main-artwork {
            height: 100%;
            width: auto;
        }

        .upload-link {
            top: 75.7%;
            width: 63%;
            height: 7%;
        }
    }
</style>
</head>
<body>
<main class="page">

    <img
        class="wide-background"
        src="tristan-ankia-home-wide.png"
        alt=""
        aria-hidden="true"
    >

    <img
        class="main-artwork"
        src="tristan-ankia-home-artwork.png"
        alt="Tristan and Ankia wedding photo challenge"
    >

    <a
        class="upload-link"
        href="./upload.html"
        aria-label="Upload your wedding photos"
        title="Upload your wedding photos"
    ></a>

</main>
</body>
</html>
