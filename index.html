<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tristan & Ankia | I Spy</title>

    <style>

        :root {
            --burgundy: #824C53;
            --blue: #99BED4;
            --blush: #FFDFE1;
            --beige: #EDE1DE;
            --white: #FFFFFF;
            --text: #604347;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: var(--beige);
            color: var(--burgundy);
        }


        /* =========================
           MAIN SCREEN
        ========================= */

        .home {
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 25px 20px;

            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    var(--beige) 0%,
                    var(--blush) 100%
                );
        }


        .content {
            width: 100%;
            max-width: 520px;

            position: relative;
            z-index: 2;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =========================
           DECORATIVE FLORALS
        ========================= */

        .flower {
            position: absolute;

            pointer-events: none;

            opacity: 0.35;

            line-height: 1;
        }


        .flower.top-left {
            top: 15px;
            left: 12px;

            font-size: 48px;

            transform: rotate(-20deg);

            color: var(--burgundy);
        }


        .flower.top-right {
            top: 20px;
            right: 15px;

            font-size: 40px;

            transform: rotate(20deg);

            color: var(--blue);
        }


        .flower.bottom-left {
            bottom: 20px;
            left: 15px;

            font-size: 38px;

            transform: rotate(15deg);

            color: var(--blue);
        }


        .flower.bottom-right {
            bottom: 15px;
            right: 12px;

            font-size: 48px;

            transform: rotate(-15deg);

            color: var(--burgundy);
        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {
            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 14px;

            color: var(--text);
        }


        /* =========================
           NAMES
        ========================= */

        h1 {
            font-size: clamp(42px, 12vw, 68px);

            font-weight: normal;

            line-height: 1;

            margin: 0;

            white-space: nowrap;
        }


        .ampersand {
            color: var(--blue);

            font-style: italic;

            padding: 0 4px;
        }


        /* =========================
           DATE
        ========================= */

        .date {
            margin-top: 14px;

            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: var(--text);
        }


        /* =========================
           FLORAL DIVIDER
        ========================= */

        .divider {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            width: 100%;

            margin: 20px 0;
        }


        .divider-line {
            width: 65px;

            height: 1px;

            background: var(--burgundy);

            opacity: 0.35;
        }


        .divider-flower {
            color: var(--blue);

            font-size: 18px;
        }


        /* =========================
           I SPY
        ========================= */

        .camera {
            font-size: 42px;

            margin-bottom: 4px;
        }


        .i-spy {
            font-size: 39px;

            font-style: italic;

            margin-bottom: 3px;
        }


        .challenge-title {
            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: var(--text);
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            max-width: 370px;

            margin-top: 17px;

            font-size: 15px;

            line-height: 1.5;

            color: var(--text);
        }


        /* =========================
           UPLOAD BUTTON
        ========================= */

        .upload-button {
            display: flex;

            align-items: center;

            justify-content: center;

            width: min(90%, 330px);

            min-height: 58px;

            margin-top: 23px;

            background: var(--burgundy);

            color: var(--white);

            text-decoration: none;

            font-family: Arial, sans-serif;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 2px;

            text-transform: uppercase;

            border-radius: 3px;

            box-shadow: 0 8px 20px rgba(130, 76, 83, 0.18);

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }


        .upload-button:hover,
        .upload-button:active {
            background: var(--blue);

            transform: translateY(-2px);
        }


        /* =========================
           SMALL TEXT
        ========================= */

        .bottom-text {
            margin-top: 13px;

            font-size: 11px;

            font-style: italic;

            color: var(--text);

            opacity: 0.8;
        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-height: 650px) {

            .home {
                padding-top: 15px;
                padding-bottom: 15px;
            }

            .welcome {
                margin-bottom: 8px;
            }

            h1 {
                font-size: 42px;
            }

            .date {
                margin-top: 9px;
            }

            .divider {
                margin: 13px 0;
            }

            .camera {
                font-size: 34px;
            }

            .i-spy {
                font-size: 32px;
            }

            .message {
                margin-top: 10px;
                font-size: 13px;
            }

            .upload-button {
                margin-top: 15px;
                min-height: 52px;
            }

        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .home {
                padding: 40px;
            }

            .flower.top-left {
                top: 35px;
                left: 35px;
                font-size: 65px;
            }

            .flower.top-right {
                top: 40px;
                right: 40px;
                font-size: 55px;
            }

            .flower.bottom-left {
                bottom: 35px;
                left: 40px;
                font-size: 55px;
            }

            .flower.bottom-right {
                bottom: 35px;
                right: 35px;
                font-size: 65px;
            }

        }

    </style>
</head>


<body>


    <main class="home">


        <!-- Decorative flowers -->

        <div class="flower top-left">
            ✿
        </div>

        <div class="flower top-right">
            ❀
        </div>

        <div class="flower bottom-left">
            ❀
        </div>

        <div class="flower bottom-right">
            ✿
        </div>


        <div class="content">


            <!-- Welcome -->

            <div class="welcome">
                Welcome to our wedding
            </div>


            <!-- Names -->

            <h1>
                Tristan
                <span class="ampersand">&amp;</span>
                Ankia
            </h1>


            <!-- Date -->

            <div class="date">
                27 September 2026
            </div>


            <!-- Divider -->

            <div class="divider">

                <span class="divider-line"></span>

                <span class="divider-flower">
                    ❀
                </span>

                <span class="divider-line"></span>

            </div>


            <!-- I Spy -->

            <div class="camera">
                📷
            </div>


            <div class="i-spy">
                I Spy...
            </div>


            <div class="challenge-title">
                The Wedding Photo Challenge
            </div>


            <!-- Message -->

            <p class="message">

                Capture the special moments,
                complete your table's challenges
                and help create memories
                Tristan &amp; Ankia will treasure forever.

            </p>


            <!-- Upload -->

            <a
                href="Upload.html"
                class="upload-button"
            >
                📸 &nbsp; Upload Your Photos
            </a>


            <div class="bottom-text">
                Snap • Scan • Share • Win 🏆
            </div>


        </div>

    </main>


</body>
</html>
