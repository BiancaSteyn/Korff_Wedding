<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tristan & Ankia Wedding Photos</title>


<style>

:root {
    --blue: #A9C9DA;
    --cream: #FFFDF8;
    --burgundy: #824C53;
    --soft-burgundy: #955D64;
}


* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {
    min-height: 100%;
}


body {

    background: var(--blue);

    color: var(--burgundy);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    overflow-x: hidden;
}


/* =========================
   PAGE
========================= */

.page {

    position: relative;

    min-height: 100svh;

    overflow: hidden;

    padding:
        55px 18px 45px;

}


/* =========================
   CORNER FLOWERS
========================= */

.floral {

    position: absolute;

    width:
        clamp(180px, 27vw, 360px);

    height: auto;

    pointer-events: none;

    user-select: none;

    z-index: 0;
}


.top-left {

    top: -10px;
    left: -10px;

}


.top-right {

    top: -10px;
    right: -10px;

}


.bottom-left {

    bottom: -10px;
    left: -10px;

}


.bottom-right {

    bottom: -10px;
    right: -10px;

}


/* =========================
   CONTENT
========================= */

.content {

    position: relative;

    z-index: 2;

    width:
        min(100%, 650px);

    margin:
        0 auto;

    text-align:
        center;

}


/* =========================
   HEADER
========================= */

.eyebrow {

    font-size:
        clamp(11px, 2vw, 16px);

    letter-spacing:
        .28em;

    text-transform:
        uppercase;

    margin-bottom:
        14px;

}


h1 {

    font-size:
        clamp(42px, 8vw, 82px);

    line-height:
        1;

    font-weight:
        400;

    margin-bottom:
        16px;

}


.date {

    font-size:
        clamp(14px, 2.5vw, 20px);

    letter-spacing:
        .30em;

    text-transform:
        uppercase;

    margin-bottom:
        26px;

}


/* =========================
   CAMERA
========================= */

.camera-art {

    display:
        block;

    width:
        min(270px, 62vw);

    height:
        auto;

    margin:
        0 auto 5px;

}


/* =========================
   TITLE
========================= */

.title {

    font-size:
        clamp(62px, 12vw, 125px);

    line-height:
        .9;

    font-style:
        italic;

    font-weight:
        400;

    margin-bottom:
        10px;

}


.subtitle {

    font-size:
        clamp(13px, 2.5vw, 21px);

    letter-spacing:
        .16em;

    text-transform:
        uppercase;

    margin-bottom:
        28px;

}


/* =========================
   CARD
========================= */

.card {

    width:
        min(100%, 540px);

    margin:
        0 auto;

    padding:
        30px 28px 32px;

    background:
        var(--cream);

    border-radius:
        16px;

    box-shadow:
        0 12px 30px
        rgba(72, 50, 50, .12);

}


/* =========================
   INSTRUCTIONS
========================= */

.instructions {

    font-size:
        clamp(16px, 2.7vw, 20px);

    line-height:
        1.5;

    margin-bottom:
        25px;

    font-style:
        italic;

}


/* =========================
   TABLE SELECT
========================= */

.label {

    display:
        block;

    text-align:
        left;

    font-size:
        13px;

    letter-spacing:
        .12em;

    text-transform:
        uppercase;

    margin-bottom:
        8px;

}


#tableSelect {

    width:
        100%;

    min-height:
        54px;

    padding:
        12px 15px;

    border:
        1px solid
        rgba(130, 76, 83, .35);

    border-radius:
        8px;

    background:
        white;

    color:
        var(--burgundy);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        16px;

    cursor:
        pointer;

}


/* =========================
   FILE UPLOAD
========================= */

.upload-label {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    width:
        100%;

    min-height:
        58px;

    margin-top:
        18px;

    padding:
        14px 18px;

    border:
        2px dashed
        var(--burgundy);

    border-radius:
        10px;

    background:
        rgba(255,255,255,.65);

    color:
        var(--burgundy);

    font-size:
        15px;

    letter-spacing:
        .08em;

    text-transform:
        uppercase;

    cursor:
        pointer;

}


.upload-label:hover {

    background:
        white;

}


#photoInput {

    display:
        none;

}


/* =========================
   PREVIEW
========================= */

.preview {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        10px;

    margin-top:
        18px;

}


.preview-item {

    position:
        relative;

}


.preview-item img {

    width:
        82px;

    height:
        82px;

    object-fit:
        cover;

    border-radius:
        7px;

    border:
        2px solid
        var(--blue);

}


.remove-photo {

    position:
        absolute;

    top:
        -7px;

    right:
        -7px;

    width:
        23px;

    height:
        23px;

    border:
        none;

    border-radius:
        50%;

    background:
        var(--burgundy);

    color:
        white;

    cursor:
        pointer;

}


/* =========================
   SUBMIT
========================= */

.submit-button {

    width:
        100%;

    min-height:
        60px;

    margin-top:
        22px;

    border:
        none;

    border-radius:
        9px;

    background:
        var(--burgundy);

    color:
        white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        16px;

    letter-spacing:
        .14em;

    text-transform:
        uppercase;

    cursor:
        pointer;

    box-shadow:
        0 7px 18px
        rgba(72, 32, 38, .16);

}


.submit-button:disabled {

    opacity:
        .55;

    cursor:
        not-allowed;

}


/* =========================
   STATUS
========================= */

.status {

    min-height:
        24px;

    margin-top:
        16px;

    font-size:
        14px;

    line-height:
        1.4;

}


.status.success {

    color:
        #46694c;

}


.status.error {

    color:
        #8b3d45;

}


/* =========================
   FOOTER
========================= */

.footer {

    margin-top:
        22px;

    font-size:
        12px;

    letter-spacing:
        .18em;

    text-transform:
        uppercase;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .page {

        padding:
            35px 12px 30px;

    }


    .floral {

        width:
            145px;

    }


    .top-left,
    .top-right {

        top:
            -5px;

    }


    .bottom-left,
    .bottom-right {

        bottom:
            -5px;

    }


    .card {

        padding:
            24px 17px 27px;

    }


    .camera-art {

        width:
            min(220px, 58vw);

    }


    .title {

        font-size:
            68px;

    }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 380px) {

    .floral {

        width:
            120px;

    }


    h1 {

        font-size:
            39px;

    }


    .title {

        font-size:
            60px;

    }

}

</style>

</head>


<body>


<main class="page">


    <!-- TOP FLOWERS -->

    <img
        class="floral top-left"
        src="wedding_assets/flowers-top-left.png"
        alt=""
    >

    <img
        class="floral top-right"
        src="wedding_assets/flowers-top-right.png"
        alt=""
    >


    <!-- BOTTOM FLOWERS -->

    <img
        class="floral bottom-left"
        src="wedding_assets/flowers-bottom-left.png"
        alt=""
    >

    <img
        class="floral bottom-right"
        src="wedding_assets/flowers-bottom-right.png"
        alt=""
    >



    <section class="content">


        <h1>
            Tristan &amp; Ankia's Wedding
        </h1>


        <div class="date">
            27 September 2026
        </div>


        <img
            class="camera-art"
            src="wedding_assets/flowers-camera.png"
            alt=""
        >


        <div class="title">
            I Spy...
        </div>


        <div class="subtitle">
            Wedding Photos
        </div>



        <section class="card">


            <p class="instructions">
                Capture the moments,
                choose your table,
                and upload your photos. ❤️
            </p>


            <!-- TABLE -->

            <label
                class="label"
                for="tableSelect"
            >
                Choose your table
            </label>


            <select id="tableSelect">

                <option value="">
                    Choose your table
                </option>

                <option value="1">
                    Table 1
                </option>

                <option value="2">
                    Table 2
                </option>

                <option value="3">
                    Table 3
                </option>

                <option value="4">
                    Table 4
                </option>

                <option value="5">
                    Table 5
                </option>

                <option value="6">
                    Table 6
                </option>

                <option value="7">
                    Table 7
                </option>

                <option value="8">
                    Table 8
                </option>

            </select>



            <!-- PHOTOS -->

            <label
                class="upload-label"
                for="photoInput"
            >
                📷 &nbsp; Choose Photos
            </label>


            <input
                id="photoInput"
                type="file"
                accept="image/*"
                multiple
            >


            <div
                id="preview"
                class="preview"
            ></div>



            <!-- SEND -->

            <button
                id="submitButton"
                class="submit-button"
                type="button"
            >
                Upload Photos
            </button>


            <div
                id="status"
                class="status"
            ></div>


        </section>


        <div class="footer">
            Snap • Share • Celebrate ❤️
        </div>


    </section>


</main>



<script>

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxWe7X76wDyx08ck8xCEJDJbMUAYn24tbXVLZzCKmxzvF2G6rpvaLA8HHEiNUB_QB5d/exec";


const photoInput =
    document.getElementById("photoInput");

const preview =
    document.getElementById("preview");

const submitButton =
    document.getElementById("submitButton");

const status =
    document.getElementById("status");

const tableSelect =
    document.getElementById("tableSelect");


let selectedFiles = [];



/* =========================
   SELECT PHOTOS
========================= */

photoInput.addEventListener(
    "change",
    function () {

        const newFiles =
            Array.from(photoInput.files);

        selectedFiles =
            selectedFiles.concat(newFiles);

        photoInput.value = "";

        updatePreview();

    }
);



/* =========================
   PREVIEW
========================= */

function updatePreview() {

    preview.innerHTML = "";


    selectedFiles.forEach(
        function (file, index) {

            const item =
                document.createElement("div");

            item.className =
                "preview-item";


            const img =
                document.createElement("img");


            img.src =
                URL.createObjectURL(file);


            const remove =
                document.createElement("button");


            remove.type =
                "button";

            remove.className =
                "remove-photo";

            remove.textContent =
                "×";


            remove.onclick =
                function () {

                    selectedFiles.splice(
                        index,
                        1
                    );

                    updatePreview();

                };


            item.appendChild(img);

            item.appendChild(remove);

            preview.appendChild(item);

        }
    );

}



/* =========================
   COMPRESS IMAGE
========================= */

function compressImage(file) {

    return new Promise(
        function (resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    const img =
                        new Image();


                    img.onload =
                        function () {

                            const maxSize =
                                1600;

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if (
                                width >
                                maxSize ||
                                height >
                                maxSize
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        height *
                                        (maxSize /
                                        width);

                                    width =
                                        maxSize;

                                }
                                else {

                                    width =
                                        width *
                                        (maxSize /
                                        height);

                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                function (blob) {

                                    const reader2 =
                                        new FileReader();


                                    reader2.onload =
                                        function () {

                                            resolve({
                                                name:
                                                    file.name,

                                                type:
                                                    "image/jpeg",

                                                data:
                                                    reader2
                                                    .result
                                                    .split(",")[1]
                                            });

                                        };


                                    reader2.onerror =
                                        reject;


                                    reader2.readAsDataURL(
                                        blob
                                    );

                                },

                                "image/jpeg",

                                0.82

                            );

                        };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        }
    );

}



/* =========================
   UPLOAD
========================= */

submitButton.addEventListener(
    "click",
    async function () {


        if (
            selectedFiles.length === 0
        ) {

            status.className =
                "status error";

            status.textContent =
                "Please choose at least one photo.";

            return;

        }


        submitButton.disabled =
            true;


        status.className =
            "status";

        status.textContent =
            "Preparing your photos...";


        try {


            /*
             * IMPORTANT:
             *
             * Blank table = General folder.
             */

            const table =
                tableSelect.value ||
                "general";


            const files = [];


            for (
                let i = 0;
                i < selectedFiles.length;
                i++
            ) {

                status.textContent =
                    "Preparing photo " +
                    (i + 1) +
                    " of " +
                    selectedFiles.length +
                    "...";


                const compressed =
                    await compressImage(
                        selectedFiles[i]
                    );


                files.push(
                    compressed
                );

            }


            status.textContent =
                "Uploading your photos...";


            /*
             * Send to Apps Script.
             *
             * no-cors is intentional.
             * Google Apps Script does not provide
             * normal CORS headers for this request.
             */

            await fetch(
                SCRIPT_URL,
                {
                    method:
                        "POST",

                    mode:
                        "no-cors",

                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({
                            table:
                                table,

                            files:
                                files
                        })
                }
            );


            /*
             * With no-cors we cannot read
             * Google's response.
             *
             * If the request reached Apps Script,
             * the files will be created in Drive.
             */

            status.className =
                "status success";

            status.textContent =
                "Your photos have been uploaded! ❤️";


            selectedFiles = [];

            updatePreview();


            submitButton.disabled =
                false;


        }
        catch (error) {

            console.error(error);


            status.className =
                "status error";

            status.textContent =
                "Something went wrong. Please try again.";


            submitButton.disabled =
                false;

        }

    }
);

</script>


</body>

</html>
